# kind cluster config for the "learn" cluster
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane        # a single node that does everything
    extraPortMappings:         # copy as-is; explained in lesson 8
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP